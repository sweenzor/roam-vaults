# Profiles the extension in Roam's real desktop app (Linux build, under Xvfb) with generated vaults:
# first-scan time, memory (peak and settled), page render and lookup latency, Rescan, and a later start
# from the cache. See extension/test/real-roam/profile.mjs. It runs on demand: Actions > Profile > Run
# workflow, with the vault sizes and the branches, tags or commits to compare (the first is the one
# the others are compared with). All builds of a size run in the same Roam on the same runner, so the
# numbers to read are the differences between columns.
#
# It also runs on every pull request that changes the extension, at 10,000 notes, base against the PR,
# and fails when the PR is clearly slower or heavier than its base (extension/test/real-roam/gate.mjs
# has the limits). A PR that looks worse is measured a second time before the run fails.
#
# Each size runs as its own job on its own runner. Results are in each job's summary and in the
# profile-<size> artifact (RESULTS.md, profile.json, memory.log, screenshots). Needs the same
# ROAM_EMAIL and ROAM_PASSWORD repository secrets as real-roam.yml, and is skipped without them.
name: Profile

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: Vault sizes in notes, comma separated (for example 10000,100000,1000000; up to 2000000)
        default: '10000'
      refs:
        description: Branches, tags or commits to compare, comma separated, first is the baseline (label=ref names a column)
        default: 'main'
  pull_request:
    paths:
      - 'extension/**'
      - '.github/workflows/profile.yml'

permissions:
  contents: read

concurrency:
  group: profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.plan.outputs.ok }}
      sizes: ${{ steps.plan.outputs.sizes }}
      refs: ${{ steps.plan.outputs.refs }}
    steps:
      - name: Pick the sizes and builds
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          HAS_EMAIL: ${{ secrets.ROAM_EMAIL != '' }}
          HAS_PASSWORD: ${{ secrets.ROAM_PASSWORD != '' }}
          INPUT_SIZES: ${{ inputs.sizes }}
          INPUT_REFS: ${{ inputs.refs }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$HAS_EMAIL" != true ] || [ "$HAS_PASSWORD" != true ]; then
            echo "::notice::Skipped: add the ROAM_EMAIL and ROAM_PASSWORD repository secrets to profile the extension in real Roam."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          case "$EVENT" in
            pull_request) sizes=10000; refs="$BASE_REF=$BASE_SHA,this PR=$HEAD_SHA" ;;
            *) sizes="$INPUT_SIZES"; refs="$INPUT_REFS" ;;
          esac
          json=$(printf '%s' "$sizes" | jq -Rc '[split(",")[] | gsub("[ _,]"; "") | select(length > 0) | tonumber]') \
            || { echo "::error::Sizes must be numbers separated by commas: $sizes"; exit 1; }
          echo "$json" | jq -e 'length > 0 and all(. >= 10 and . <= 2000000)' >/dev/null \
            || { echo "::error::Each size must be between 10 and 2,000,000 notes: $sizes"; exit 1; }
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "sizes=$json" >> "$GITHUB_OUTPUT"
          echo "refs=$refs" >> "$GITHUB_OUTPUT"
          echo "Sizes $json, builds $refs"

  profile:
    needs: plan
    if: needs.plan.outputs.ok == 'true'
    name: profile (${{ matrix.size }} notes)
    strategy:
      fail-fast: false
      matrix:
        size: ${{ fromJSON(needs.plan.outputs.sizes) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.size >= 500000 && 355 || matrix.size >= 50000 && 120 || 50 }}
    env:
      ROAM_VERSION: 0.0.42
      ROAM_DEB_SHA512: x9Ln56V7TlDO6zDcXK0AKDeAmz5LSX1oWpKbV6w7CUzbMc/LESJ7qLQs0Ap/nPpwPCf7jUypd0LS05SsJbD/HA==
      OUT: ${{ github.workspace }}/profile-out
      REFS: ${{ needs.plan.outputs.refs }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Make room on disk
        if: matrix.size >= 300000
        run: |
          # a million notes is about 5.5 GB on disk, plus Roam's copy of the cache
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build each ref
        run: |
          builds=""; i=0
          IFS=',' read -ra entries <<< "$REFS"
          for e in "${entries[@]}"; do
            e="$(printf '%s' "$e" | sed 's/^ *//; s/ *$//')"
            [ -n "$e" ] || continue
            if [[ "$e" == *=* ]]; then label="${e%%=*}"; ref="${e#*=}"; else label="$e"; ref="$e"; fi
            sha=$(git rev-parse --verify -q "origin/$ref^{commit}" || git rev-parse --verify -q "$ref^{commit}") \
              || { echo "::error::No branch, tag or commit named $ref"; exit 1; }
            dir="$RUNNER_TEMP/builds/$i"
            git worktree add -q --detach "$dir" "$sha"
            (cd "$dir/extension" && npm ci --no-audit --no-fund --silent && npm run build --silent)
            echo "$sha" > "$dir/extension/.profile-commit"
            echo "$label: $sha"
            builds+="${builds:+,}$label=$dir/extension/dist"
            i=$((i + 1))
          done
          echo "BUILDS=$builds" >> "$GITHUB_ENV"

      - name: Cache the Roam installer
        uses: actions/cache@v4
        with:
          path: ~/roam-deb
          key: roam-deb-${{ env.ROAM_VERSION }}

      - name: Install Roam, Xvfb and Playwright
        run: |
          mkdir -p ~/roam-deb
          deb=~/roam-deb/roam-research_${ROAM_VERSION}_amd64.deb
          [ -f "$deb" ] || curl -fsSL -o "$deb" "https://roam-electron-deploy.s3.us-east-2.amazonaws.com/roam-research_${ROAM_VERSION}_amd64.deb"
          echo "$(echo "$ROAM_DEB_SHA512" | base64 -d | od -An -v -tx1 | tr -d ' \n')  $deb" | sha512sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y -qq "$deb" xvfb
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core@1.63.0

      - name: Profile in real Roam
        working-directory: extension
        env:
          ROAM_EMAIL: ${{ secrets.ROAM_EMAIL }}
          ROAM_PASSWORD: ${{ secrets.ROAM_PASSWORD }}
          ROAM_GRAPH: ${{ vars.ROAM_GRAPH || 'vault-spike-hosted' }}
          SIZES: ${{ matrix.size }}
          GATE: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: |
          Xvfb :99 -screen 0 1440x900x24 >/dev/null 2>&1 &
          export DISPLAY=:99
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node test/real-roam/profile.mjs

      - name: Summary
        if: always()
        run: '[ -f "$OUT/RESULTS.md" ] && cat "$OUT/RESULTS.md" >> "$GITHUB_STEP_SUMMARY" || true'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-${{ matrix.size }}
          path: profile-out/
          if-no-files-found: ignore
          retention-days: 30
